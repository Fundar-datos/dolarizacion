name: Claves de la semana por email

# Los sábados, con el cierre del viernes ya en data/monitor.json (lo deja la
# actualización diaria), manda las claves de la semana por email. El envío
# automático está desactivado: se manda a mano con «Enviar las claves por
# email». Para reactivarlo, poner ENVIO_AUTOMATICO en true; necesita los
# secretos SMTP_USER, SMTP_PASSWORD y REPORTE_PARA.
on:
  schedule:
    - cron: "17 13 * * 6"
  workflow_dispatch:

permissions:
  contents: read

env:
  ENVIO_AUTOMATICO: "false"

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.ENVIO_AUTOMATICO == 'true' }}

      - uses: actions/setup-python@v5
        if: ${{ env.ENVIO_AUTOMATICO == 'true' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Enviar por email
        if: ${{ env.ENVIO_AUTOMATICO == 'true' }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORTE_PARA: ${{ secrets.REPORTE_PARA }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-inter
          pip install -r requirements.txt matplotlib
          python -m monitor.enviar
